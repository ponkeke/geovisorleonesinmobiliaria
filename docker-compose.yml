services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: leones
      POSTGRES_PASSWORD: leones
      POSTGRES_DB: geovisor
    ports:
      - "5433:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
